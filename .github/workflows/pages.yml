# Build, test and publish to GitHub Pages.
# - Runs on every push to main, every pull request into main, tags v* and manual runs.
# - static, unit and build run in parallel; e2e and visual test the build job's _site/.
# - gate succeeds only when every job above succeeded. It is the one required check for branch
#   protection (the matrix jobs count through it).
# - deploy needs gate and runs only on main, for pushes and manual runs (a manual run republishes,
#   for example after re-enabling Pages): a red run never deploys, and the live site stays at the
#   last green build. Pull requests and tags never deploy. release (tags only) attaches the
#   single-file build.
# Uses only the built-in GITHUB_TOKEN, with the least permissions per job. The allowlist of
# commit emails is the repository variable ALLOWED_COMMIT_EMAILS (Settings > Secrets and
# variables > Actions > Variables).
# Every job runs locally with the same commands: scripts/ci-local.sh <job> (npm run ci:<job>).
name: pages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history, for the commit identity check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Biome (format, lint, device-access rule)
        run: npx biome ci .
      - name: Layer check (domain ← content ← sim ← store ← app)
        run: node scripts/check-layers.ts
      - name: Banned-terms check
        run: node scripts/check-banned.ts
      - name: Banned-terms meta-test
        run: npx vitest run tests/unit/check-banned.test.ts
      - name: Commit identity check
        env:
          ALLOWED_COMMIT_EMAILS: ${{ vars.ALLOWED_COMMIT_EMAILS }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-identity.sh
      - name: Content check (schemas, cross-file rules, seed arithmetic)
        run: node scripts/check-content.ts
      - name: State-version check (replay inputs against content/replay-fingerprint.json)
        run: node scripts/check-state-version.ts

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit, golden, property and performance tests
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (writes reports/bundle.html)
        run: npx vite build
      - name: Build the single-file backup
        run: npx vite build --mode single
      - name: Assemble the site (legacy at the root, app under next/)
        run: node scripts/assemble-site.mjs
      - name: Budgets (initial JS, precache, assets)
        run: node scripts/check-budgets.ts
      - name: Banned-terms check of the built manifest
        run: node scripts/check-banned.ts --manifest dist/manifest.webmanifest
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 7
          if-no-files-found: error
      - name: Upload the single-file backup
        uses: actions/upload-artifact@v4
        with:
          name: bcps-single-file
          path: dist-single/index.html
          if-no-files-found: error
      - name: Upload the bundle report and budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/3 }
          - { browser: chromium, shard: 2/3 }
          - { browser: chromium, shard: 3/3 }
          - { browser: webkit, shard: 1/1 }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Download the single-file backup
        uses: actions/download-artifact@v4
        with:
          name: bcps-single-file
          path: dist-single
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end (${{ matrix.browser }}, shard ${{ matrix.shard }})
        env:
          BCPS_PREBUILT_SITE: '1'
        # A shard can be empty while there are fewer spec files than shards.
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }} --pass-with-no-tests
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Baselines are only valid in this image; keep it in step with
    # @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Visual comparison
        env:
          BCPS_PREBUILT_SITE: '1'
        run: npx playwright test --project=visual --pass-with-no-tests
      - name: Keep the differences of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  gate:
    needs: [static, unit, build, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "gate: a required job did not succeed ($r)"
              exit 1
            fi
          done

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the single-file backup
        uses: actions/download-artifact@v4
        with:
          name: bcps-single-file
          path: dist-single
      - name: Attach it to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist-single/index.html "bcps-${TAG}.html"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "bcps-${TAG}.html" --clobber
