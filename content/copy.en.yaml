# Every public UI string. Fields in {braces} are filled in by the app.
# Keep clock times out of copy; the app formats times from its own clock.

app:
  title: BCPS

boot:
  framed: This page can't be displayed inside another site.

tape:
  row: "{time} {from} → {to} · {amount} BCPS · {status} · fee {fee}"
  empty: No payments yet today
