  infoLabel: More about this fee
  cardInfoLabel: More about card fees

# Merchant payment-detail lines (shared.tx, the business view of a sale).
txDetail:
  net: Net {net} · Transaction fee 1% · {fee} BCPS (≈ €{eur})
  cards: Cards typically ≈ €{cardLow}–{cardHigh} · 1.5–3% plus additional charges
  payout: Card payout would typically arrive {first}–{last} (1–3 business days) · typical
  final: Final · no chargebacks

errors:
  insufficientFunds: You have {have} BCPS. Top up {short} BCPS to pay.
  unknownRecipient: No BCPS user '{handle}'. Check the spelling.
  selfPayment: You can't pay yourself.
  invalidAmount: "Enter an amount above {min}."
  maxAmount: The maximum is {max} BCPS.
  invalidState: This was already {status}.
  notAllowed: Only {name} can do this.
  quoteChanged: The amount changed. Check it and try again.
  expired: This code has expired
  cancelled: This code was cancelled
  paid: This code was already paid.
  sessionFull: Your session is getting long. Reset to start again.
  generic: Something went wrong. Try again.

seedRows:
  topUp: Top up · {method} €{eur}
  methods:
    bank-transfer: bank transfer
    card: card
    local-method: local payment method
