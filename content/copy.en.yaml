  final: Final · no chargebacks

errors:
  insufficientFunds: You have {have}. Top up {short} to pay.
  unknownRecipient: No BCPS user '{handle}'. Check the spelling.

seedRows:
  topUp: Top up · {method} €{eur}
  methods:
    bank-transfer: bank transfer
    card: card
    local-method: local payment method
  carriedOver: Balance carried over
  dailySales: Daily sales · {count} payments
  todaySoFar: Today so far · {count} payments
  autoConverted: "Auto-converted {sharePct}% to EUR · {amount} BCPS · Conversion to EUR: 1.5% · {fee} BCPS · ≈ €{eur} to bank"
  cashOut: "Cash out · {amount} BCPS · Conversion to EUR: 1.5% · {fee} BCPS · ≈ €{eur} to bank"

