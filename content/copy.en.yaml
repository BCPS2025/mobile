  infoLabel: More about this fee
  cardInfoLabel: More about card fees

# Merchant payment-detail lines (shared.tx, the business view of a sale).
txDetail:
  net: Net {net} · Transaction fee 1% · {fee} BCPS (≈ €{eur})
