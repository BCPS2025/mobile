# History at T0 and the other starting records.
# Amounts are BCPS strings with exactly two decimals and no grouping. Times are local
# Europe/Ljubljana: a day offset from T0 plus "HH:MM"; startedAt is the same day's first sale.
# Postings are derived per row and always sum to zero:
#   feePayer sender:    from −(amount + fee), to +amount,        sys:fees +fee
#   feePayer recipient: from −amount,         to +(amount − fee), sys:fees +fee
#   no policy:          from −amount,         to +amount
#   conversion (off-ramp): from −amount,      to +(amount − fee), sys:fees +fee
#                       (the converter pays out of the amount; the row has no feePayer)
# A policy's fee is computed; a `fee` or `eur` written on a row is checked against it.
# Daily sales summary rows carry `summary` (count, gross, optional product mix); their fee is
# the policy's 1% of the gross (rounded once per row), paid by the business. `party` names the
# person behind sys:offstage. The carried-over rows and Marko's taxi share with Ana's pizza
# keep the start balances.

