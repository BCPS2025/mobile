# One entry per notification kind. Notifications are derived from the ledger, never stored; the
# fields in braces are filled from state. Euro amounts appear only in the payment detail. `banner`
# and `toast`: also shown as an in-app banner when the account is on a phone, and as a toast when
# it is not. `toastTitle` and `toastLine`: the stage's toast where it is drawn shorter than the
# banner (without them the toast names the account's phone and repeats the banner). Outgoing
# payments create no notification; their receipt is the feedback.
p2p.received:  { to: payee,    title: "@{payer} sent you {amount} BCPS",  line: "{note}",                 opens: tx, banner: true, toast: true }
sale.received: { to: merchant, title: "Payment received · {amount} BCPS", line: "from @{payer} · {items}", toastTitle: "Payment received", toastLine: "{amount} BCPS from @{payer}", opens: tx, banner: true, toast: true }
